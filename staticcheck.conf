# staticcheck's default check set, written out rather than inherited so a
# staticcheck upgrade that changes its defaults arrives in a diff here instead
# of silently in CI. This is exactly v0.8.1's default: "all" minus the checks
# it marks non-default (lintcmd/cmd.go). No opinionated ST check beyond the
# default is enabled and no default check is disabled. The `invariants` job in
# .github/workflows/ci.yml runs it at that pinned version.
checks = ["all", "-SA9003", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
