name: Flake ledger

# Runs after every CI run on main, never on the PR path. The PR path is where
# wall-clock is expensive and this adds none to it: no lane in ci.yml is
# touched, and nothing here runs before a merge.
#
# `workflow_run` rather than a schedule, and the difference is not cosmetic.
# Consecutive pushes to main are a median 43 minutes apart but p90 7.3 hours and
# max 12.8; in a quiet week they are days apart. A daily cron would cost one
# runner minute and delay every finding by up to 24 hours on top of that. This
# costs ~1 minute per main run -- about 20 a day at the busiest, all of it free
# on a public repo -- and reports a merge-commit flake within a minute of the
# merge, which is the only latency that matters here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      window-days:
        # No default here, and none in the step below either. This input used to
        # default to 7 and `workflow_run` carries no inputs, so every automatic
        # sweep ran a 7-day window while flake-sweep.sh documented 30 and said
        # in a comment that the window must stay comfortably wider than the
        # 14-day deadline. A window narrower than the deadline makes deleting a
        # row -- or the whole table -- green in both halves at once. The script
        # owns the number and refuses anything below its floor; leave this empty
        # to get it.
        description: Days of main runs to re-derive (default and minimum come from flake-sweep.sh)
        required: false

permissions:
  contents: read

# A merge burst produces four runs in a minute (2026-08-14 13:40 did exactly
# that), and each would sweep an almost identical window and report a
# near-identical verdict. The last one has the most complete picture, so let it
# cancel the others. Nothing in this job writes anywhere, so what this saves is
# duplicated API calls and four copies of one report -- not two jobs racing the
# same write, which is what it saved before the pull request step was removed.
concurrency:
  group: flake-ledger
  cancel-in-progress: true

jobs:
  sweep:
    name: Flake sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Per-attempt jobs and their logs. This is the whole point: a rerun
      # overwrites a run's conclusion, and only the attempt-level endpoints
      # still hold what the original run said.
      actions: read
      # Read-only. This job used to end by
      # opening a ledger PR and held `contents: write` and `pull-requests: write`
      # for that one step. It could never work: Actions is not permitted to
      # create pull requests in this repository (`default_workflow_permissions:
      # read`, `can_approve_pull_request_reviews: false`), and that is a
      # repo-level switch standing above the job token -- no `permissions:` block
      # can lift it. Every sweep did the whole measurement and then died on
      # `createPullRequest`.
      #
      # So the lane stops at reporting, and the cost of that is named here rather
      # than left to be discovered: nobody's branch is prepared any more. Whoever
      # fixes the ledger runs `.github/scripts/flake-sweep.sh sync --owner BEO-541`
      # locally, using the repository's `BEO-<number>` issue-ID format, from the
      # diff this job writes to its run summary.
      #
      # `contents: read` is not only for the checkout: `observe` reads
      # `/repos/../compare/A...B` twice, for the self-heal touch check and for
      # `fixed:` reachability. And one call has no grant here at all --
      # `/repos/../commits/<sha>/pulls`, documented as `pull-requests: read`.
      # It works because this repository is public and the token keeps public
      # read; run 32105880361 exercised it end-to-end under exactly this block.
      # If munsu is ever made private that call breaks first, and it is the
      # fast path -- the route most verdicts come from.
      contents: read
    steps:
      - uses: actions/checkout@v6

      # The classifier is the part that can be wrong without anyone noticing,
      # so it is pinned by committed fixtures before it is trusted with live
      # data. cluster-13-40 is the real record set of four main runs from
      # 2026-08-14: two of them read `success` at run level today because they
      # were rerun, and the fixture requires all three original reds to come
      # back out. If that ever stops holding, this job stops before it can file
      # anything.
      #
      # It runs here rather than in `invariants` so ci.yml keeps exactly one new
      # step. The cost is real and worth naming: a PR that breaks the
      # classifier stays green until it merges.
      - name: Classifier must agree with its fixtures
        run: .github/scripts/flake-sweep.sh selftest

      - name: Derive the flaky set from what CI already ran
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW: ${{ inputs.window-days }}
        run: |
          set -eu
          .github/scripts/flake-sweep.sh observe ${WINDOW:+--window-days "$WINDOW"} > records.tsv
          wc -l < records.tsv | xargs printf 'observation records: %s\n'

      # Fail-closed, in the same shape as `deadcode.sh check`: a flake CI can
      # see and the file does not name is red, and so is a row this sweep read
      # the run for and found nothing behind. The failure is recorded here, on
      # main, and the remedy is the diff the step below prints -- so this job
      # going red means "main's ledger is out of date", not "someone should press
      # rerun".
      - name: Ledger must match what CI observed
        id: compare
        continue-on-error: true
        env:
          SWEEP_RECORDS: records.tsv
        run: .github/scripts/flake-sweep.sh check

      # `fixed:<sha>` is the one state no deadline is compared against, and the
      # hermetic half can only judge its shape. This is the half that can check
      # the commit exists and is reachable from main.
      #
      # Its own step rather than a fourth direction inside `check`, because the
      # remedies differ: `check`'s is `sync`, and the step below treats "the
      # comparison failed but sync changed nothing" as a bug in the script. A
      # wrong fix ref is repaired by a person, and sync cannot write that diff --
      # folded in, it would look like that bug.
      - name: "Every fixed: row must cite a commit on main"
        id: fixed
        continue-on-error: true
        env:
          SWEEP_RECORDS: records.tsv
        run: .github/scripts/flake-sweep.sh verify-fixed

      # What this lane produces now that it has no branch to hand anyone. The job
      # already knows exactly what the ledger has to become; a red that does not
      # say so makes the reader re-derive it from scratch, and a lane that costs
      # more to read than to ignore gets ignored.
      #
      # `sync` writes .github/flake-ledger.md in the runner's working tree. That
      # is a local write and needs no token at all -- `contents: write` is about
      # the API, and nothing below calls it. No commit, no branch, no push.
      #
      # It runs without `--owner`: the bot cannot know which issue will own a
      # flake, so the diff it prints carries the TBD rows flake-ledger.sh
      # refuses, and the summary block below tells the reader to re-run sync
      # with the real issue id.
      #
      # `continue-on-error` for the same reason as the two steps above: `Report
      # the verdicts` is the one place this job fails, and this step exiting
      # non-zero on its own would report one red twice.
      - name: Write the ledger diff to the run summary
        id: diff
        if: steps.compare.outcome == 'failure'
        continue-on-error: true
        env:
          SWEEP_RECORDS: records.tsv
        run: |
          set -eu
          .github/scripts/flake-sweep.sh sync

          # Kept from the step that used to open the PR, and kept separate for
          # the reason `verify-fixed` is a separate step: two causes with
          # different remedies get two messages, never one. "The ledger is out of
          # date" is fixed by applying the diff. "check failed and sync produced
          # no diff" cannot be fixed by editing the ledger at all -- the two
          # halves of flake-sweep.sh are reading the same records and reaching
          # opposite conclusions, and that is a bug in the script.
          if git diff --quiet -- .github/flake-ledger.md; then
            {
              echo '## Flake sweep: the two halves of `flake-sweep.sh` disagree'
              echo
              echo '`check` failed, and then `sync` changed nothing. **This is not a stale ledger**'
              echo 'and editing `.github/flake-ledger.md` will not fix it: the comparison and the'
              echo 'rewrite are reading the same records and reaching opposite conclusions, which is'
              echo 'a bug in `.github/scripts/flake-sweep.sh`.'
              echo
              echo 'The `flake-sweep` artifact on this run holds `records.tsv`, the observation'
              echo 'stream both halves read. Start there:'
              echo
              echo '```sh'
              echo 'SWEEP_RECORDS=records.tsv .github/scripts/flake-sweep.sh check'
              echo 'SWEEP_RECORDS=records.tsv .github/scripts/flake-sweep.sh sync'
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::the comparison failed but sync changed nothing -- the two disagree, which is a bug in flake-sweep.sh, not a stale ledger; the run summary and the flake-sweep artifact have the records to debug it"
            exit 1
          fi

          git diff -- .github/flake-ledger.md >ledger.diff
          {
            echo '## Flake sweep: `.github/flake-ledger.md` is out of date'
            echo
            echo 'Nothing prepares a branch for you. Apply this yourself, on a branch of your own:'
            echo
            echo '```sh'
            echo '.github/scripts/flake-sweep.sh sync --owner BEO-541'
            echo '```'
            echo
            echo '`--owner` names the issue that will fix the test, and it has to be a real one:'
            echo '`.github/scripts/flake-ledger.sh check` refuses `owner_issue: TBD` on purpose, so'
            echo '`invariants` stays red until a real issue id sits in that column. Filing the flake'
            echo 'and filing the work are meant to be the same act -- run `sync` with `--owner` and'
            echo 'the rows it writes carry that issue and merge; run it without and they say `TBD`,'
            echo 'which the same refusal rejects the same way.'
            echo
            echo 'If you think a row is wrong, argue with it in the owning issue rather than'
            echo 'deleting it -- the sweep re-derives the same row on the next `main` run.'
            echo
            echo '<details><summary>The diff <code>sync</code> produced on this run</summary>'
            echo
            echo '```diff'
            cat ledger.diff
            echo '```'
            echo
            echo '</details>'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::error::.github/flake-ledger.md is out of date. Run '.github/scripts/flake-sweep.sh sync --owner BEO-541' locally -- owners must use the BEO-<number> issue-ID format, and a real issue id is required because flake-ledger.sh check refuses TBD on purpose. The diff and the rest of this are in the run summary."

      # The summary is what a person reads on the run page; this is for the diff
      # that is too long to read there, and for `records.tsv`. The records matter
      # most in the branch above: once the runner is gone, a "the two halves
      # disagree" report with no records attached is a bug nobody can reproduce.
      #
      # 14 days is the ledger's deadline, so the evidence outlives the row it is
      # about by exactly as long as anyone has to act on it.
      #
      # `continue-on-error` because this step reports and does not get a vote on
      # the verdict. A failed step skips every later step whose `if:` carries no
      # status function -- GitHub ANDs an implicit `success()` in -- so without
      # it an upload failure would skip `Report the verdicts` and leave the job
      # red at an upload, saying nothing about the ledger. That is the invariant
      # stated six lines below, and this is the one step that could take it.
      #
      # `overwrite: true` was proposed here for a 409 on "Re-run failed jobs",
      # and it is not needed: artifacts are scoped per *attempt*, not per run.
      # Re-running the failed job of run 32105880361 under this exact step
      # uploaded a second `flake-sweep` (id 9315866367) beside attempt 1's
      # (9313120233), both retained, no conflict. Left out rather than kept as
      # insurance -- the reason it was wanted does not exist, and a flag whose
      # comment describes a conflict that cannot happen is the defect this file
      # was just cleaned of.
      - name: Upload the records and the synced ledger
        if: steps.compare.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flake-sweep
          path: |
            records.tsv
            ledger.diff
            .github/flake-ledger.md
          if-no-files-found: warn
          retention-days: 14

      # The two verdicts above are this job's verdict, and this is the only step
      # that fails *on a verdict*. Every step that reports one carries
      # `continue-on-error` to keep it that way: so a wrong fix ref does not stop
      # the comparison from being reported, so the diff still gets written and
      # uploaded when the comparison fails, and so no reporting step can end the
      # job before this one is reached -- not to swallow any of them.
      #
      # `checkout`, `selftest` and `observe` deliberately do not carry it. A
      # failure there is not a verdict about the ledger, it is the sweep being
      # unable to measure at all, and it must stop the job rather than be
      # reported as if the ledger had been checked.
      #
      # `steps.diff` is not tested here on purpose: it only runs when
      # `compare` already failed, so this step is already red whenever it is, and
      # naming it would be a condition that can never change the outcome.
      - name: Report the verdicts
        if: steps.compare.outcome == 'failure' || steps.fixed.outcome == 'failure'
        run: exit 1
