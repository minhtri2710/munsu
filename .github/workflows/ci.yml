name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: mkdir -p coverage
      - run: go build ./...
      - run: go vet ./...
      # -coverprofile on all three lanes below feeds the `guards` job. Measured
      # locally (darwin, 8 cores, warm cache) the default lane goes 95.0s ->
      # 96.1s with it, which is inside the noise: `set` mode counters are a
      # single store per block. The profiles are what let that job tell "no test
      # reaches this refusal" from "this refusal is only reached by a lane that
      # is not this one" -- see .github/scripts/uncovered-guards.sh.
      - run: go test -coverprofile=coverage/default.out ./...
      # GOOS-gated files never compile on a linux runner, so no test lane can
      # reach them -- three _test.go files had never been compiled by CI at
      # all. Cross-target vet is the only cover for the darwin-gated files; the
      # windows-gated files are also compiled and vetted natively by the
      # `windows-build-vet` job below, and `go vet` includes test files.
      # GOOS=windows also covers the `!darwin && !linux` file.
      - name: Cross-target vet for GOOS-gated files
        run: |
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
      # `go test ./...` never builds these two tags, which is where a compile
      # break sat unnoticed for four months. The tagged suites are small and
      # fast; the reason, without a figure, is in the matching row of
      # .github/build-tags.manifest. So they run for real rather than being
      # compile-checked. Go's granularity is the package, so each step also
      # repeats its package's default suite (~24s total); deriving the package from
      # the tag is worth that over an enumerated -run filter that a new test
      # would silently fall outside of.
      - name: e2e-tagged tests
        run: go test -count=1 -tags e2e -coverprofile=coverage/e2e.out $(.github/scripts/build-tags.sh packages e2e)
      - name: lifecycle_integration-tagged tests
        run: go test -count=1 -tags lifecycle_integration -coverprofile=coverage/lifecycle_integration.out $(.github/scripts/build-tags.sh packages lifecycle_integration)
      # Uploaded even when a step above failed, so a lane that got partway still
      # hands over what it measured. `warn` rather than `error` on an empty
      # upload, because `always()` also fires when `go build` broke and there is
      # nothing to collect yet -- erroring there would put a second, misleading
      # red next to the compile error that actually stopped the job.
      #
      # Nothing is lost by being quiet here: the fail-closed check lives
      # downstream, where it can tell the difference. uncovered-guards.sh treats
      # a missing or empty profile as fatal, so a path that stops matching turns
      # the `guards` job red with the lane named, instead of being read as zeros.
      - name: Upload coverage for the guards lane
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-build
          path: coverage/
          if-no-files-found: warn
          retention-days: 1

  windows-build-vet:
    name: Windows build and vet
    runs-on: windows-latest
    timeout-minutes: 30
    # Gate for the two steps promoted out of the windows observation lane
    # (windows-observation.yml): `go build ./...` and `go vet ./...` were green
    # on windows before this landed, and this job runs them on pushes to `main`
    # and pull requests targeting `main`, matching the workflow triggers above.
    # Making it a required check -- by name, "Windows build
    # and vet" -- is a branch-protection change owned by a human, and that
    # change has not been made. The failing windows tests stay in the
    # observation lane and are not gated here. If anything else is promoted out
    # of that lane later, promotion has to invert the lane's exit-code capture
    # -- a failure has to fail this job directly. Do not promote by adding
    # continue-on-error.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # The default lane runs without -race, so crash/replay/fence concurrency
      # in home, taskauthority and backend was never race-checked in CI.
      #
      # -tags integration was added after measuring (local, 8 cores, count=1):
      #   this lane as it stood, `-race ./...`            88.9s
      #   this lane with -tags integration               190.5s   2.1x
      #   integration packages without -race             176.3s
      # So the lane roughly doubles, but the last row is why that is worth
      # paying: running the integration suites *under* -race costs only ~14s
      # more than running them at all. Those suites wait on processes and the
      # filesystem rather than burning CPU, and CPU is what -race taxes. 60
      # integration files had never been through the race detector; 3m10s is
      # ~13% of the 25m timeout, so that stays untouched.
      #
      # This lane keeps ./... while the integration lane restricts itself to
      # the tagged packages: the concurrency worth race-checking lives mostly
      # in packages with no integration files at all (taskauthority, home),
      # so narrowing this one would lose the coverage it exists for.
      #
      # Note `//go:build !race` (orchestrator/lifecycle_lifecycle_test.go) is
      # still excluded here and always will be -- see .github/build-tags.manifest.
      - run: go test -race -count=1 -timeout 25m -tags integration ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # `go test ./...` never builds integration-tagged files, so this suite
      # was invisible to CI. The package list used to be maintained by hand;
      # it is now derived from the tag itself, so a `//go:build integration`
      # file in a sixth package joins the lane instead of silently falling
      # outside it.
      #
      # -v is deliberate: tests gate themselves on prerequisites with t.Skip
      # (the backend tmux/herdr/cmux/orca suites need the binary on PATH; the
      # tmux tests provision their own disposable session, so no test depends
      # on a live server), and without per-test output a skipped test is
      # indistinguishable from a passing one in the job log.
      - run: mkdir -p coverage
      - run: go test -v -count=1 -timeout 35m -tags integration -coverprofile=coverage/integration.out $(.github/scripts/build-tags.sh packages integration)
      # This is the profile the merge cannot do without. soldier_soldier_test.go
      # is integration-tagged, so `soldier_launch.go:474.23` reads count 0 in the
      # default profile and count 1 here; without this artifact the guards lane
      # would call that branch untested, along with every other branch these 60
      # files are the only cover for.
      # `warn` on an empty upload for the reason given on the build lane's copy.
      - name: Upload coverage for the guards lane
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/
          if-no-files-found: warn
          retention-days: 1

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    # Every other rule in this job reads the checkout and nothing else, and the
    # workflow-level `contents: read` is all they need. The last step reads the
    # conclusion of main's newest flake sweep, which is an Actions API call; the
    # argument for admitting it is at that step. A job-level block replaces the
    # workflow-level one rather than adding to it, so `contents: read` is
    # repeated here for the checkout.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      # gofmt's output is a function of the toolchain version, so the runner
      # image's preinstalled Go would let that lane drift against the 1.26
      # developers use -- pin it like every other job. The reachability lane
      # below needs the same toolchain for a different reason: it type-checks
      # the module, so it has to agree with the compiler the other jobs use.
      # `cache: true` since that lane arrived: this job now builds a tool and
      # loads every package, so the module and build caches are read, not just
      # written.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Symlinks must stay intact
        run: |
          set -eu
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      # Every `//go:build` tag must be classified in .github/build-tags.manifest
      # and, if it claims a lane, a non-comment line of this file must carry
      # that lane's command. Catches the tag that arrives with no lane at all --
      # the one gap deriving package lists from the tree cannot close by itself.
      # The lane assertion is textual, not semantic: it does not evaluate `if:`,
      # so it catches a lane that was forgotten or commented out, not one
      # deliberately disabled. See the header of build-tags.sh for the limits.
      - name: Build tags must be covered by a lane
        run: .github/scripts/build-tags.sh check
      # `gofmt -l` was in no lane at all, and 21 files were adrift when this
      # was added. It belongs next to the build-tag rule above rather than in
      # `build`: both are cheap textual invariants, and the two are coupled --
      # gofmt is what normally hoists a legacy `// +build` line and writes the
      # `//go:build` line that the tag derivation reads. With no lane forcing
      # gofmt, "the old syntax upgrades itself" stopped being true here, which
      # is why that rule has to fail closed on its own.
      #
      # For every real constraint shape, this lane now *subsumes* the rule
      # above: gofmt does not only touch the leading comment block, it hoists a
      # `// +build` line from below the package clause to the top and writes the
      # matching `//go:build`, so `gofmt -l` lists that file. A line inside a
      # function body is hoisted too, but the `//go:build` only appears on a
      # second pass -- so one `gofmt -w` leaves the tree still unclean there,
      # and the lane stays red until it is run again. Measured on go1.26.5, not
      # reasoned from the usual example. Keep the rule above anyway, for two
      # things this lane cannot do:
      #
      #   - Its error names the consequence -- that the tag stays invisible to
      #     lane derivation. `::error::not gofmt-clean` says nothing about that,
      #     so the author reformats and never learns what was at stake.
      #   - It is the second net if this lane's scope is ever narrowed (see the
      #     vendor note below). Subsumption holds only while this lane scans
      #     everything.
      #
      # The other direction is real too, and only this lane covers it: a file
      # whose two lines disagree (`//go:build foo` + `// +build bar`) satisfies
      # the rule above, which asks only that a `//go:build` line exist, while
      # gofmt rewrites the stale line and `-l` flags it.
      #
      # `gofmt -l` prints one path per unformatted file and nothing on a clean
      # tree, so an empty list is the pass condition. On an unparseable file it
      # writes to stderr and exits 2 while the -l list may still look clean --
      # that has to fail the lane rather than pass it, hence the explicit
      # status and stderr checks before the list is trusted.
      #
      # The argument is `.`, a filesystem walk, not a package list: `go list
      # ./...` skips `testdata/` and `_*`/`.*` directories, and a walk is what
      # makes a new file in a brand new package join this lane by existing.
      #
      # Note for whoever adds `vendor/` later: this repo has none today, so the
      # walk covering it costs nothing. Vendored third-party code carries no
      # promise of being gofmt-clean under this toolchain, so `go mod vendor`
      # can turn this lane red in bulk. Deal with it then, and weigh it against
      # the subsumption note above before reaching for the obvious fix: an
      # exclusion here is exactly what makes the build-tag rule load-bearing
      # again, so narrowing this lane without saying so there trades one guard
      # for a gap in both. Do not pre-add an exclusion for a directory that does
      # not exist.
      - name: Go sources must be gofmt-clean
        run: |
          set -eu
          errs="$(mktemp)"
          if ! unformatted="$(gofmt -l . 2>"$errs")" || [ -s "$errs" ]; then
            echo "::error::gofmt could not read the tree, so it cannot judge formatting:" >&2
            cat "$errs" >&2
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean -- run 'gofmt -w' on:" >&2
            # Read line by line rather than letting `printf` word-split the
            # list: a path with a space would split across two lines, and a
            # path with a glob character would be expanded against the working
            # directory, printing a name that is not the offending file.
            # Quoting the whole list instead is not the fix -- it feeds the
            # block to a single `%s`, so only the first path gets the indent.
            printf '%s\n' "$unformatted" | while IFS= read -r file; do
              printf '  %s\n' "$file" >&2
            done
            exit 1
          fi
          echo "gofmt: clean"
      # Five times now, a guard was written correctly, placed correctly, and
      # called by nothing -- and every lane above stayed green, because deleting
      # a guard does not change the happy path by a single bit. That is
      # structural, not a gap in the test suite: no measurement taken *inside* a
      # function can see that production never calls it. `EnsureNotPrimary` had
      # four tests and coverage count 2 on its refusal branch while having zero
      # production call sites (since deleted -- ADR-0009). Reachability is the
      # only lane that sees that shape of guard, and it found two more open
      # holes (BEO-64) on its first run here.
      #
      # The root is `./cmd/munsu` and `-test` is deliberately absent: a guard
      # only its own test calls is unreachable from the shipped binary, which is
      # precisely the finding. `-test` would relabel it "reachable" and silence
      # the case this lane exists for. See ADR-0009 and the script header.
      #
      # The script runs one analysis per GOOS in .github/build-tags.manifest and
      # unions them, for the same reason the cross-target vet above exists: a
      # `_darwin.go` file is invisible to a linux-only analysis, so half of every
      # platform pair would sit permanently outside this lane. That is also what
      # makes the result the same on a laptop as on the runner.
      #
      # deadcode is pinned rather than @latest: its RTA result is the input to a
      # fail-closed comparison, so an upstream change in what counts as reachable
      # has to arrive in a diff someone reads, not on a Tuesday.
      - name: Every function must be reachable from the munsu binary
        run: |
          set -eu
          go install golang.org/x/tools/cmd/deadcode@v0.49.0
          PATH="$(go env GOPATH)/bin:$PATH" .github/scripts/deadcode.sh check
      # Two ADRs landed as 0010 (BEO-93): #468 and #469 both reserved the number
      # while it was free, #469 rebased onto main without renumbering, and every
      # lane stayed green because nothing reads the ADR filenames. References by
      # number then point at whichever file the reader opens first -- ADR-0004 §5
      # cited "ADR-0010" and resolved to the wrong decision for a day.
      #
      # ADR numbers are assigned by hand, so the collision is only visible in the
      # tree: the check is that no two files under docs/adr/ share the leading
      # NNNN. Gaps are fine and one exists (no 0006) -- a missing number costs a
      # reader nothing, a duplicate one costs them the decision.
      - name: ADR numbers must be unique
        run: |
          set -eu
          dupes=$(ls docs/adr | sed -n 's/^\([0-9][0-9][0-9][0-9]\)-.*\.md$/\1/p' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate ADR numbers under docs/adr/ -- renumber the one that landed second:" >&2
            printf '%s\n' "$dupes" | while IFS= read -r n; do
              ls docs/adr/"$n"-*.md | while IFS= read -r f; do printf '  %s\n' "$f" >&2; done
            done
            exit 1
          fi
          echo "ADR numbers: unique"
      # The rule above cares that two files do not share a number; this one
      # cares that a number cited as a path has a file at all. That is the
      # adjacent hole it left open (BEO-94): ADR-0006 was deleted in #418 as
      # migration-era doctrine the ADR-0008 reset removed, and two plan docs
      # kept linking to its filename for ten days. Both lanes stayed green,
      # because nothing in this repo reads a link -- the same reason the
      # duplicate above survived.
      #
      # References are extracted by basename, so `docs/adr/NNNN-x.md` and the
      # `../adr/NNNN-x.md` form the plan docs use are the same check. The limit
      # that follows from that: this proves the target exists, not that the
      # relative depth is right, so a link written from the wrong directory
      # still passes here and fails in a browser. Basenames are unique under a
      # flat docs/adr/, so the weaker check is the whole of the deleted-target
      # class and none of the wrong-prefix one.
      #
      # Text only, no network, like the rules around it -- it reads tracked
      # files and the ADR directory and nothing else. An empty extraction is a
      # failure rather than a pass: this repo has ADR links today, so finding
      # none means the pattern stopped matching, and a guard that silently
      # matches nothing is the shape this job exists to refuse.
      - name: ADR references must point at a file that exists
        run: |
          set -eu
          refs="$(mktemp)"
          git grep -hIoE 'adr/[0-9]{4}-[A-Za-z0-9._-]+\.md' -- . | sed 's|.*/||' | sort -u > "$refs"
          if [ ! -s "$refs" ]; then
            echo "::error::No ADR references found anywhere in the tree -- the extraction pattern no longer matches, so this check proves nothing" >&2
            exit 1
          fi
          broken=0
          while IFS= read -r ref; do
            [ -f "docs/adr/$ref" ] && continue
            broken=1
            echo "::error::ADR reference has no file -- point it at a real ADR or drop the link: docs/adr/$ref" >&2
            git grep -nI -F -- "$ref" | while IFS= read -r hit; do printf '  %s\n' "$hit" >&2; done
          done < "$refs"
          [ "$broken" = 0 ] || exit 1
          echo "ADR references: $(wc -l < "$refs" | tr -d ' ') distinct, all resolve"
      # A flaky test has no owner. Every other red in this repo does -- whoever
      # wrote the change that caused it -- which is why every other lane can end
      # at "it is red, someone will fix it" and this one cannot. Four pushes to
      # main on 2026-08-14 13:40 produced three red `integration` lanes, and two
      # of those runs read `success` today: reruns overwrite a run's conclusion,
      # so the reflex a flaky lane provokes is also what erases the evidence for
      # it. .github/flake-ledger.md is where that evidence is kept instead, and
      # this step is the only thing that makes an entry cost anything.
      #
      # Past its deadline with no fix, an entry turns this lane red on every
      # open PR, including PRs with nothing to do with the flake. That is the
      # mechanism working: it appoints the next person who needs to merge, and
      # that person always exists. Without it the file is `t.Skip` with better
      # paperwork.
      #
      # Text only, no network, like the four rules above it -- it reads one
      # committed file and today's date and nothing else. The half that has to
      # talk to the Actions API is a separate workflow
      # (.github/workflows/flake-ledger.yml) and stays there; what this step
      # cannot see is that the sweep found a flake this file does not name, and
      # the last step in this job is the one that does, over the network, for
      # the reasons stated there.
      #
      # The selftest runs first, and it is here rather than in the sweep's own
      # workflow for the reason the step below exists at all: this script is the
      # half that runs on every PR, so it is the half a PR can break. Ten of its
      # rules were deleted one at a time (BEO-103) and every lane in this repo
      # stayed green -- the same shape as the unreachable guards the deadcode
      # lane above was built for. It is hermetic and takes under a second.
      - name: Flake ledger rules must agree with their fixtures
        run: .github/scripts/flake-ledger.sh selftest
      # Same argument as the step above, for the lane that arrived after it. The
      # enforcing half of the guard-coverage lane runs on every PR, so it is the
      # half a PR can break, and deleting one of its rules changes no happy path
      # at all -- the exact property that lane exists to refuse in production
      # code. One fixture per rule; the script header lists the mutation each
      # one answers. Hermetic, no artifacts, ~1s, so it belongs here rather than
      # in the guards job where it would wait on the integration lane before
      # telling anyone a rule had gone.
      - name: Guard-coverage rules must agree with their fixtures
        run: .github/scripts/uncovered-guards.sh selftest
      # The third of these, and the one whose absence was the gap it closes: the
      # sweep's own fixtures ran only from .github/workflows/flake-ledger.yml,
      # which fires on `workflow_run` for CI on `main` and on
      # `workflow_dispatch` and never on the pull-request path. So a PR that
      # broke the classifier -- or any of the check(), sync() and verify-fixed()
      # rules its scenarios pin -- went green on every gating check and first
      # failed after merge, where a failure costs most and is attributable
      # least (#565).
      #
      # `selftest` is hermetic and this step keeps it that way: it reads
      # .github/testdata/flake-sweep and a scratch ledger under $TMPDIR and
      # nothing else -- `verify-fixed`'s three answers are records in the
      # fixture rather than API calls, and `applied`'s verdict is a pure
      # function of a committed record stream for the same reason -- so running
      # it here costs no network. Hermetic like the two above, and a few
      # seconds rather than their one -- it drives the scripted scenarios
      # through subshells, and `applied`'s red path adds five more. The sweep's
      # measuring half stays in its own workflow; the one networked call this
      # job does make is the last step, argued there.
      #
      # It still runs in flake-ledger.yml as well, and that is not duplication:
      # there it is the sweep refusing to measure live data with a classifier
      # that disagrees with its fixtures, which is a different refusal from this
      # one, which is a PR not being allowed to merge the change that broke it.
      - name: Flake sweep rules must agree with their fixtures
        run: .github/scripts/flake-sweep.sh selftest
      # The fourth of these, and the one where the argument is sharpest, because
      # what it pins is a classifier rather than a file format. Loosening a
      # classifier rule does not fail: it just stops seeing a shape, silently,
      # with every lane green -- which is the same defect as the citation lane
      # not existing at all, one level up. Its own prototype is the evidence: a
      # `^func`/`^type` grep over docs/workflow-topology-matrix.md reported four
      # unresolved identifiers of which two were real, and both false positives
      # were ordinary declaration forms the grep cannot see (a struct field and
      # a const). The harness discovers every citation fixture directory and
      # checks each one against its expected behavior.
      # One further check has no fixture because an unparseable .go file would
      # turn this job's gofmt step red instead. Hermetic and ~15s.
      - name: Citation rules must agree with their fixtures
        run: .github/scripts/citations.sh selftest
      - name: Flake ledger deadlines must not have passed
        run: .github/scripts/flake-ledger.sh check
      # munsu's documents cite the code as their primary evidence, and this step
      # checks the classified paths and symbols in the covered set against the
      # tree. It compares both ways against .github/citations.allow, so a
      # citation that resolves again cannot leave its waiver behind. The set of
      # covered documents and citations is derived from the tree, except
      # docs/plans/, which is excluded as a dated document class; docFiles in
      # .github/scripts/citations/main.go owns that boundary.
      #
      # Text only, no network: the stdlib-only Go program parses the tree with
      # go/parser. It ignores line numbers and reports classified-but-unjudged
      # shapes as `unchecked`; extractor and classifier boundaries are owned by
      # .github/scripts/citations/main.go.
      - name: Documentation citations must resolve
        run: .github/scripts/citations.sh check
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
      # The one step in this job that is not a pure function of the checkout,
      # and the reason it is here rather than in a lane of its own.
      #
      # The ledger rules above enforce .github/flake-ledger.md against the
      # checkout. None of them can see that the *sweep* observed a flake the
      # file does not name, because that comparison needs the Actions API, so it
      # lives in .github/workflows/flake-ledger.yml -- which fires on
      # `workflow_run` after CI on main and never on the pull-request path. Run
      # 32153420356 reported a race-lane flake with no row on 2026-08-18 and the
      # row was still unfiled twelve days later (#541). Nothing was broken: the
      # one job that knew was the one nobody's merge waited for.
      #
      # A fifth lane would reproduce that exactly. Branch protection on main
      # requires four contexts -- "Build and test", "Race detector",
      # "Integration tests" and this one -- so a new job would go red and be
      # merged past, which is the hole rather than the fix. `Refusal-branch
      # coverage` and `Windows build and vet` are already in that position.
      #
      # So one step here reads over the network. On a healthy repository it
      # reads one thing -- the conclusion of main's newest completed sweep --
      # and is done in two seconds. When that is red it re-asks the sweep's own
      # question of the ledger in this checkout and passes if this checkout
      # answers it, which is the sweep's full cost and is only paid while main's
      # ledger is actually stale. That second half is not optional: main's old
      # verdict is not a verdict about this branch, and gating on it alone would
      # refuse the very pull request that applies the diff, leaving nothing able
      # to clear either. It re-derives rather than exempting a PR that touches
      # the file, so the only way out of the deadlock is the fix.
      #
      # The cost is the property the steps above used to claim for the whole job
      # -- its verdict is no longer reproducible from a checkout alone, and an
      # Actions API outage reds every open PR. Priced and accepted, because it
      # is the mechanism the deadline rule already runs on: that one also reds
      # PRs with nothing to do with the flake, and for the same reason. A flake
      # has no owner until something appoints one, and the appointment is always
      # the next person to merge.
      #
      # Fail-closed in both directions this can be uncertain: no run to read and
      # a record it cannot parse are each red. Everything that decides anything
      # is a pure function of the record streams and is pinned by the fixtures
      # the selftest above runs, which are the real runs from #541's history.
      #
      # Last in the job on purpose, so every rule that can answer from the
      # checkout has already reported before the one that can fail for a reason
      # outside this repository.
      - name: Main's last flake sweep must have been acted on
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/flake-sweep.sh applied

  guards:
    name: Refusal-branch coverage
    runs-on: ubuntu-latest
    # The reachability lane in `invariants` sees a guard nothing calls. It cannot
    # see a guard that IS called and whose refusal branch no test has ever taken:
    # deleting such a branch changes no happy path, so every lane above stays
    # green. Coverage is what sees that, which is why this job is separate --
    # it is the only one that has to wait for other jobs' profiles.
    #
    # `needs` on both, because merging all four lanes is a correctness condition
    # rather than a nicety: with the default profile alone every branch the 60
    # integration files are the only cover for reads as untested. The script
    # fails closed on a missing profile rather than treating it as zeros.
    needs: [build, integration]
    steps:
      - uses: actions/checkout@v6
      # Derivation is a go/packages type-check of the whole tree once for each of
      # GOOS linux, darwin and windows (the union that covers every build-gated
      # file for the repository's targeted GOOS; a file gated to an untargeted
      # GOOS stays unloaded and uses the name fallback), run with `go run .` from
      # the tool's own module directory (see
      # uncovered-guards.sh sites). This job now also downloads that module's
      # dependencies; the whole run is roughly one to five seconds depending on
      # the build cache. Same toolchain as every other job so the type-check
      # agrees with the compiler that produced the profiles.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Collect the coverage profiles
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: .github/coverage
      # The identity ratchet admits disclosed pure growth but rejects mixed
      # changes, and compares baseline identities with the exact target branch
      # base. A stacked PR must not compare against origin/main:
      # that would mistake the parent stack's legitimate baseline entries for
      # growth in this child. Pushes use the predecessor commit instead.
      - name: Fetch the exact base for the guard ratchet
        env:
          GUARDS_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin "$GUARDS_BASE_REF"
          echo "GUARDS_BASE_REF=$GUARDS_BASE_REF" >> "$GITHUB_ENV"
      - name: Every refusal branch must be tested or waived
        run: .github/scripts/uncovered-guards.sh check
