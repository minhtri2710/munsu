name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ordinary PR runs supersede each other; main pushes and auto-update's parked bot runs stay isolated.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - run: mkdir -p coverage
      - run: go build ./...
      - run: go vet ./...
      # -coverprofile feeds the `guards` job, merged with the race lane's
      # integration profile -- see .github/scripts/uncovered-guards.sh. atomic
      # because -race forces it there and the merge refuses mixed modes.
      - run: |
          set -o pipefail
          go test -count=1 -json -covermode=atomic -coverprofile=coverage/default.out ./... | tee coverage/skips-default.json | jq -rj '.Output // empty'
      # GOOS-gated files never compile on a linux runner, so no test lane can
      # reach them -- three _test.go files had never been compiled by CI at
      # all. Cross-target vet is the only cover for the darwin-gated files, and
      # `go vet` includes test files.
      - name: Cross-target vet for GOOS-gated files
        run: |
          GOOS=darwin go vet ./...
      # Uploaded even when a step above failed, so a lane that got partway still
      # hands over what it measured. `warn` rather than `error` on an empty
      # upload, because `always()` also fires when `go build` broke and there is
      # nothing to collect yet -- erroring there would put a second, misleading
      # red next to the compile error that actually stopped the job.
      #
      # Nothing is lost by being quiet here: the fail-closed check lives
      # downstream, where it can tell the difference. uncovered-guards.sh treats
      # a missing or empty profile as fatal, so a path that stops matching turns
      # the `guards` job red with the lane named, instead of being read as zeros.
      - name: Upload coverage for the guards lane
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-build
          path: coverage/
          if-no-files-found: warn
          retention-days: 1

  darwin-fence:
    name: Darwin fence tests
    runs-on: macos-latest
    timeout-minutes: 20
    # The soldier and reviewer write fence is sandbox-exec, which exists only
    # on darwin; every other lane compiles these tests (GOOS=darwin vet) but
    # never runs their darwin branches. This job runs internal/fence whole and
    # the named fleet tests that apply or assert the real fence. The names are
    # the gate's single source: `go test -list`
    # with the anchored pattern must return exactly these names before
    # anything runs, so a rename fails here instead of leaving the lane, and a
    # new fence test stays out until it is added below. Not a required check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - name: Fence tests
        run: |
          set -euo pipefail
          gated() {
            tags="$1"; want="$(printf '%s\n' "$2" | sed 's/^[[:space:]]*//' | sort)"
            re="^($(printf '%s\n' "$want" | paste -sd '|' -))\$"
            got="$(go test -tags "$tags" -list "$re" ./internal/fleet/ | grep '^Test' | sort || true)"
            if [ "$got" != "$want" ]; then
              echo "::error::-run pattern does not select exactly the gated tests (renamed or deleted?)"
              diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") || true
              exit 1
            fi
            go test -tags "$tags" -count=1 ./internal/fleet/ -run "$re" -v
          }
          go test -count=1 ./internal/fence/ -v
          gated "" 'TestBuildLaunchArtifactExecsTheHarnessUnderTheFence
          TestBuildLaunchArtifactRefusesAnArgvTheFenceCannotWrap
          TestProbeFenceRecordsTheProjectsWritableRoots
          TestProbeFenceRefusals
          TestProbeFenceRecordsTheSeatFence
          TestProbeFenceOnAHostWithoutAFence
          TestLaunchRecordsTheSeatOfTheLaunch
          TestProbeFenceRefusesTheSeatsPathDirs
          TestProbeFencePreCreatesTheRemoteReflogs
          TestFencedSoldierWritesOnlyItsOwnFiles
          TestFencedSoldierReadsCommittedTaskDocuments
          TestFencedSoldierCannotTakeTheGitShimOffItsPath
          TestFencedClaudeLaunchRunsFromItsOwnConfigDir
          TestFencedClaudeReviewerWritesItsOwnConfigDir
          TestFencedClaudePreflightAsksForTheSeatsLogin
          TestFencedCaptainRunsItsSeatCommandsOutsideTheFence'
          gated integration 'TestReviewLaunchRunsEveryPhaseAgainstTheReviewedCheckout
          TestLaunchRunsTheCaptainUnderItsSeat'

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: false
      # Own key: -race builds differ from the other jobs', which race this job to
      # save setup-go's shared key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: go-race-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
      # The default lane runs without -race, so crash/replay/fence concurrency
      # in home, taskauthority and backend was never race-checked in CI.
      #
      # -tags integration was added after measuring (local, 8 cores, count=1):
      #   this lane as it stood, `-race ./...`            88.9s
      #   this lane with -tags integration               190.5s   2.1x
      #   integration packages without -race             176.3s
      # So the lane roughly doubles, but the last row is why that is worth
      # paying: running the integration suites *under* -race costs only ~14s
      # more than running them at all. Those suites wait on processes and the
      # filesystem rather than burning CPU, and CPU is what -race taxes. 60
      # integration files had never been through the race detector; 3m10s is
      # ~13% of the 25m timeout, so that stays untouched.
      #
      # This lane is also the integration lane: it writes the profile and the
      # `go test -json` stream the `guards` job reads for the integration tag;
      # without them every branch only integration-tagged tests reach would
      # read as untested.
      #
      # Note `//go:build !race` files are excluded here by design -- see
      # .github/build-tags.manifest. The build lane runs them.
      - run: mkdir -p coverage
      - run: |
          set -o pipefail
          go test -race -count=1 -timeout 25m -tags integration -json -coverprofile=coverage/integration.out ./... | tee coverage/skips-integration.json | jq -rj '.Output // empty'
      # `warn` on an empty upload for the reason given on the build lane's copy.
      - name: Upload coverage for the guards lane
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: coverage/
          if-no-files-found: warn
          retention-days: 1

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      # Reports only vulnerabilities whose vulnerable symbols this module can
      # reach; a dependency advisory the code never calls does not fail the lane.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # gofmt's output is a function of the toolchain version, so the runner
      # image's preinstalled Go would let that lane drift against the 1.26
      # developers use -- pin it like every other job. The reachability lane
      # below needs the same toolchain for a different reason: it type-checks
      # the module, so it has to agree with the compiler the other jobs use.
      # `cache: true` since that lane arrived: this job now builds a tool and
      # loads every package, so the module and build caches are read, not just
      # written.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - name: Symlinks must stay intact
        run: |
          set -eu
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      # Every `//go:build` tag must be classified in .github/build-tags.manifest
      # and, if it claims a lane, a non-comment line of this file must carry
      # that lane's command. Catches the tag that arrives with no lane at all --
      # the one gap deriving package lists from the tree cannot close by itself.
      # The lane assertion is textual, not semantic: it does not evaluate `if:`,
      # so it catches a lane that was forgotten or commented out, not one
      # deliberately disabled. See the header of build-tags.sh for the limits.
      - name: Build tags must be covered by a lane
        run: .github/scripts/build-tags.sh check
      # `gofmt -l` was in no lane at all, and 21 files were adrift when this
      # was added. It belongs next to the build-tag rule above rather than in
      # `build`: both are cheap textual invariants, and the two are coupled --
      # gofmt is what normally hoists a legacy `// +build` line and writes the
      # `//go:build` line that the tag derivation reads. With no lane forcing
      # gofmt, "the old syntax upgrades itself" stopped being true here, which
      # is why that rule has to fail closed on its own.
      #
      # For every real constraint shape, this lane now *subsumes* the rule
      # above: gofmt does not only touch the leading comment block, it hoists a
      # `// +build` line from below the package clause to the top and writes the
      # matching `//go:build`, so `gofmt -l` lists that file. A line inside a
      # function body is hoisted too, but the `//go:build` only appears on a
      # second pass -- so one `gofmt -w` leaves the tree still unclean there,
      # and the lane stays red until it is run again. Measured on go1.26.5, not
      # reasoned from the usual example. Keep the rule above anyway, for two
      # things this lane cannot do:
      #
      #   - Its error names the consequence -- that the tag stays invisible to
      #     lane derivation. `::error::not gofmt-clean` says nothing about that,
      #     so the author reformats and never learns what was at stake.
      #   - It is the second net if this lane's scope is ever narrowed (see the
      #     vendor note below). Subsumption holds only while this lane scans
      #     everything.
      #
      # The other direction is real too, and only this lane covers it: a file
      # whose two lines disagree (`//go:build foo` + `// +build bar`) satisfies
      # the rule above, which asks only that a `//go:build` line exist, while
      # gofmt rewrites the stale line and `-l` flags it.
      #
      # `gofmt -l` prints one path per unformatted file and nothing on a clean
      # tree, so an empty list is the pass condition. On an unparseable file it
      # writes to stderr and exits 2 while the -l list may still look clean --
      # that has to fail the lane rather than pass it, hence the explicit
      # status and stderr checks before the list is trusted.
      #
      # The argument is `.`, a filesystem walk, not a package list: `go list
      # ./...` skips `testdata/` and `_*`/`.*` directories, and a walk is what
      # makes a new file in a brand new package join this lane by existing.
      #
      # Note for whoever adds `vendor/` later: this repo has none today, so the
      # walk covering it costs nothing. Vendored third-party code carries no
      # promise of being gofmt-clean under this toolchain, so `go mod vendor`
      # can turn this lane red in bulk. Deal with it then, and weigh it against
      # the subsumption note above before reaching for the obvious fix: an
      # exclusion here is exactly what makes the build-tag rule load-bearing
      # again, so narrowing this lane without saying so there trades one guard
      # for a gap in both. Do not pre-add an exclusion for a directory that does
      # not exist.
      - name: Go sources must be gofmt-clean
        run: |
          set -eu
          errs="$(mktemp)"
          if ! unformatted="$(gofmt -l . 2>"$errs")" || [ -s "$errs" ]; then
            echo "::error::gofmt could not read the tree, so it cannot judge formatting:" >&2
            cat "$errs" >&2
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean -- run 'gofmt -w' on:" >&2
            # Read line by line rather than letting `printf` word-split the
            # list: a path with a space would split across two lines, and a
            # path with a glob character would be expanded against the working
            # directory, printing a name that is not the offending file.
            # Quoting the whole list instead is not the fix -- it feeds the
            # block to a single `%s`, so only the first path gets the indent.
            printf '%s\n' "$unformatted" | while IFS= read -r file; do
              printf '  %s\n' "$file" >&2
            done
            exit 1
          fi
          echo "gofmt: clean"
      # The scripts under .github/scripts are the gate itself. The file list is
      # derived from git, so a new script joins by existing; git's `*` crosses `/`, so
      # nested directories are covered too. The `run:` blocks of every workflow
      # are shell too, and actionlint hands each one to the same shellcheck
      # binary (it also checks the workflow syntax and expressions). Default
      # severity, no waivers file: an intended construct carries a
      # `# shellcheck disable=` with its reason at the site.
      #
      # ubuntu-latest preinstalls shellcheck from apt (0.9.0 on the 24.04
      # image), and its version moves with the image. So the release binary is
      # fetched at a pinned version and checked against the sha256 GitHub
      # publishes as that asset's digest, for the reason deadcode is pinned
      # below: a new rule should arrive in a diff someone reads.
      - name: Shell scripts must be shellcheck-clean
        run: |
          set -eu
          dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $dir/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$dir/shellcheck.tar.xz" -C "$dir" --strip-components=1
          "$dir/shellcheck" --version
          scripts="$(git ls-files -- '.github/scripts/*.sh')"
          if [ -z "$scripts" ]; then
            echo "::error::no tracked shell script under .github/scripts -- this step is checking nothing" >&2
            exit 1
          fi
          git ls-files -z -- '.github/scripts/*.sh' | xargs -0 "$dir/shellcheck"
          echo "shellcheck: clean in $(printf '%s\n' "$scripts" | wc -l | tr -d ' ') scripts"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck "$dir/shellcheck"
          echo "actionlint: clean"
      # staticcheck at the check set chosen in staticcheck.conf, which is
      # exactly v0.8.1's default. Pinned for the reason deadcode is: its result
      # decides this job, so a new check has to arrive in a diff. v0.8.1 is
      # also the floor, since v0.7.0 cannot read Go 1.26 export data.
      #
      # It runs once per build configuration a lane compiles, because a hit in
      # a tagged or GOOS-gated file is invisible to a default-tag run: every
      # test-lane tag and every goos-vet GOOS in .github/build-tags.manifest,
      # derived rather than listed, so a new tag joins here as it joins its
      # lane. The binary is installed for the host first and GOOS is set only
      # for the analysed code; `GOOS=darwin go run` would build a darwin
      # binary and fail to execute it here.
      #
      # No allowlist: any hit fails the step.
      - name: staticcheck must report nothing
        run: |
          set -eu
          GOBIN="$RUNNER_TEMP/staticcheck" go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          sc="$RUNNER_TEMP/staticcheck/staticcheck"
          "$sc" -version
          tags="$(awk -F '\t' '$2 == "test-lane" { print $1 }' .github/build-tags.manifest)"
          goos="$(awk -F '\t' '$2 == "goos-vet" { print $1 }' .github/build-tags.manifest)"
          if [ -z "$tags" ] || [ -z "$goos" ]; then
            echo "::error::no test-lane tag or goos-vet GOOS derived from .github/build-tags.manifest -- the extraction no longer matches" >&2
            exit 1
          fi
          failed=0
          echo "--- default tags"
          "$sc" ./... || failed=1
          while IFS= read -r tag; do
            echo "--- -tags $tag"
            "$sc" -tags "$tag" ./... || failed=1
          done <<<"$tags"
          while IFS= read -r os; do
            echo "--- GOOS=$os"
            GOOS="$os" "$sc" ./... || failed=1
          done <<<"$goos"
          [ "$failed" -eq 0 ] || exit 1
          echo "staticcheck: clean"
      # Five times now, a guard was written correctly, placed correctly, and
      # called by nothing -- and every lane above stayed green, because deleting
      # a guard does not change the happy path by a single bit. That is
      # structural, not a gap in the test suite: no measurement taken *inside* a
      # function can see that production never calls it. `EnsureNotPrimary` had
      # four tests and coverage count 2 on its refusal branch while having zero
      # production call sites (since deleted). Reachability is the
      # only lane that sees that shape of guard, and it found two more open
      # holes on its first run here.
      #
      # The root is `./cmd/munsu` and `-test` is deliberately absent: a guard
      # only its own test calls is unreachable from the shipped binary, which is
      # precisely the finding. `-test` would relabel it "reachable" and silence
      # the case this lane exists for. See the script header.
      #
      # The script runs one analysis per GOOS in .github/build-tags.manifest and
      # unions them, for the same reason the cross-target vet above exists: a
      # `_darwin.go` file is invisible to a linux-only analysis, so half of every
      # platform pair would sit permanently outside this lane. That is also what
      # makes the result the same on a laptop as on the runner.
      #
      # deadcode is pinned rather than @latest: its RTA result is the input to a
      # fail-closed comparison, so an upstream change in what counts as reachable
      # has to arrive in a diff someone reads, not on a Tuesday.
      - name: Every function must be reachable from the munsu binary
        run: |
          set -eu
          go install golang.org/x/tools/cmd/deadcode@v0.49.0
          PATH="$(go env GOPATH)/bin:$PATH" .github/scripts/deadcode.sh selftest
          PATH="$(go env GOPATH)/bin:$PATH" .github/scripts/deadcode.sh check
      # A flaky test has no owner. Every other red in this repo does -- whoever
      # wrote the change that caused it -- which is why every other lane can end
      # at "it is red, someone will fix it" and this one cannot. Four pushes to
      # main on 2026-08-14 13:40 produced three red `integration` lanes, and two
      # of those runs read `success` today: reruns overwrite a run's conclusion,
      # so the reflex a flaky lane provokes is also what erases the evidence for
      # it. .github/flake-ledger.md is where that evidence is kept instead, and
      # this step is the only thing that makes an entry cost anything.
      #
      # Past its deadline with no fix, an entry turns this lane red on every
      # open PR, including PRs with nothing to do with the flake. That is the
      # mechanism working: it appoints the next person who needs to merge, and
      # that person always exists. Without it the file is `t.Skip` with better
      # paperwork.
      #
      # Text only, no network, like the four rules above it -- this hermetic
      # half reads one committed file and today's date and nothing else. The
      # networked half runs only in flake-ledger.yml, after a merge, to report
      # and propose the remediation.
      #
      # The selftest runs first, and it is here rather than in the sweep's own
      # workflow for the reason the step below exists at all: this script is the
      # half that runs on every PR, so it is the half a PR can break. Ten of its
      # rules were deleted one at a time and every lane in this repo
      # stayed green -- the same shape as the unreachable guards the deadcode
      # lane above was built for. It is hermetic and takes under a second.
      - name: Flake ledger rules must agree with their fixtures
        run: .github/scripts/flake-ledger.sh selftest
      # Same argument as the step above, for the lane that arrived after it. The
      # enforcing half of the guard-coverage lane runs on every PR, so it is the
      # half a PR can break, and deleting one of its rules changes no happy path
      # at all -- the exact property that lane exists to refuse in production
      # code. One fixture per rule; the script header lists the mutation each
      # one answers. Hermetic, no artifacts, ~1s, so it belongs here rather than
      # in the guards job where it would wait on the race lane before telling
      # anyone a rule had gone.
      - name: Guard-coverage rules must agree with their fixtures
        run: .github/scripts/uncovered-guards.sh selftest
      # The third of these, and the one whose absence was the gap it closes: the
      # sweep's own fixtures ran only from .github/workflows/flake-ledger.yml,
      # which fires on `workflow_run` for CI on `main` and on
      # `workflow_dispatch` and never on the pull-request path. So a PR that
      # broke the classifier -- or any of the check(), sync() and verify-fixed()
      # rules its scenarios pin -- went green on every gating check and first
      # failed after merge, where a failure costs most and is attributable
      # least (#565).
      #
      # `selftest` is hermetic and this step keeps it that way: it reads
      # .github/testdata/flake-sweep and a scratch ledger under $TMPDIR and
      # nothing else. It pins the classifier and the check/sync/verify-fixed
      # rules without making API calls. The post-merge workflow runs the same
      # selftest while reporting live sweep data; this PR-side selftest protects
      # the rules that can otherwise be broken while every happy-path lane stays
      # green.
      - name: Flake sweep rules must agree with their fixtures
        run: .github/scripts/flake-sweep.sh selftest
      # The script that derives every tagged lane's package list and fails a
      # tag no lane covers had no fixtures, so deleting one of its rules left
      # every lane green. One scratch tree per rule, hermetic, ~1s.
      - name: Build-tag rules must agree with their fixtures
        run: .github/scripts/build-tags.sh selftest
      # auto-update-branch.yml runs this script with `actions: write`, and it
      # approves CI runs. The selftest replays one repository through a fake
      # `gh` on PATH and pins exactly which runs it approves and which PRs it
      # updates or refuses. Hermetic: the fake answers every call.
      - name: Auto-update rules must agree with their fixtures
        run: .github/scripts/update-auto-merge-prs.sh selftest
      # Every `uses:` in every workflow must be a full 40-hex commit SHA or a
      # ./ local action: a tag or branch ref can be moved by the action's owner.
      # The selftest pins each accepted and refused form; `check` scans the
      # workflows `git ls-files` finds. Hermetic, <1s.
      - name: Action pin rules must agree with their fixtures
        run: .github/scripts/action-pins.sh selftest
      - name: Workflow actions must be pinned to a commit SHA
        run: .github/scripts/action-pins.sh check
      # Go tools under .github/scripts are outside the root module graph: the
      # go tool skips dot-directories, and `guardsites`, `skipledger` and
      # `testnames` are their own modules, so a root `./...` reaches none of
      # them. The selftests above compile their tools, but compilation alone
      # does not execute unit tests, so those tests could rot or be deleted
      # while every existing lane stayed green.
      #
      # The directory list is derived from tracked `.go` files, never
      # declared, which also keeps the `.github/testdata` fixture module out
      # by construction. `go vet` is in
      # the contract because these tools are the only Go in the repository no
      # vet lane reaches. A directory with no running test is a failure, not
      # a pass: `[no test files]` is what test rot looks like on its way out.
      # `gofmt` needs no help; its filesystem walk already covers this tree.
      - name: Go tools under .github must vet and test
        run: |
          set -eu
          dirs="$(mktemp)"
          out="$(mktemp)"
          build_out="$(mktemp -d)"
          trap 'rm -f "$dirs" "$out"; rm -rf "$build_out"' EXIT
          git ls-files -- '.github/scripts/**/*.go' | sed 's|/[^/]*$||' | sort -u >"$dirs"
          if [ ! -s "$dirs" ]; then
            echo "::error::no Go tool directory found under .github/scripts -- this step is measuring nothing" >&2
            exit 1
          fi
          failed=0
          # Redirected from a file rather than piped into: a `while` on the
          # right of a pipe runs in a subshell, where the `failed=1` below is
          # discarded and every failing tool reads as a pass.
          while IFS= read -r dir; do
            echo "--- $dir"
            rm -rf "${build_out:?}"/*
            # Compile package and test sources without running tests first, so
            # syntax/type/build errors are reported as build failures rather
            # than being misclassified as vet failures or missing tests.
            if ! (cd "$dir" && go test -c -vet=off -o "$build_out/" ./...) >"$out" 2>&1; then
              echo "::error::$dir build failed" >&2
              failed=1
            elif ! (cd "$dir" && go vet ./...) >"$out" 2>&1; then
              echo "::error::$dir vet failed" >&2
              failed=1
            elif ! (cd "$dir" && go test -v -count=1 ./...) >"$out" 2>&1; then
              echo "::error::$dir tests failed" >&2
              failed=1
            elif ! grep -q '^=== RUN ' "$out"; then
              echo "::error::$dir declares no test that runs" >&2
              failed=1
            fi
            cat "$out"
          done <"$dirs"
          [ "$failed" -eq 0 ] || exit 1
          echo "go tools: vet and test clean in $(wc -l <"$dirs" | tr -d ' ') directories"
      - name: Flake ledger deadlines must not have passed
        run: .github/scripts/flake-ledger.sh check
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi

  guards:
    name: Refusal-branch coverage
    runs-on: ubuntu-latest
    # The reachability lane in `invariants` sees a guard nothing calls. It cannot
    # see a guard that IS called and whose refusal branch no test has ever taken:
    # deleting such a branch changes no happy path, so every lane above stays
    # green. Coverage is what sees that, which is why this job is separate --
    # it is the only one that has to wait for other jobs' profiles.
    #
    # `needs` on both, because merging both lanes is a correctness condition
    # rather than a nicety: with the default profile alone every branch the 60
    # integration files are the only cover for reads as untested. The script
    # fails closed on a missing profile rather than treating it as zeros.
    needs: [build, race]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Derivation is a go/packages type-check of the whole tree once for each of
      # GOOS linux and darwin (the union that covers every build-gated file for
      # the repository's targeted GOOS; a file gated to an untargeted GOOS
      # stays unloaded and uses the name fallback), run with `go run .` from
      # the tool's own module directory (see
      # uncovered-guards.sh sites). This job now also downloads that module's
      # dependencies; the whole run is roughly one to five seconds depending on
      # the build cache. Same toolchain as every other job so the type-check
      # agrees with the compiler that produced the profiles.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - name: Collect the coverage profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: .github/coverage
      # The identity ratchet admits disclosed pure growth but rejects mixed
      # changes, and compares baseline identities with the exact target branch
      # base. A stacked PR must not compare against origin/main:
      # that would mistake the parent stack's legitimate baseline entries for
      # growth in this child. Pushes use the predecessor commit instead.
      - name: Fetch the exact base for the guard ratchet
        env:
          GUARDS_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin "$GUARDS_BASE_REF"
          echo "GUARDS_BASE_REF=$GUARDS_BASE_REF" >> "$GITHUB_ENV"
      - name: Every refusal branch must be tested or waived
        run: .github/scripts/uncovered-guards.sh check
      # Fails on a skipped test with no row in .github/skips.allow, on a row no
      # lane skips, and on a lane whose `go test -json` stream is missing.
      - name: Every skipped test must be listed in the skip ledger
        run: .github/scripts/skip-ledger.sh check
